[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infant-brain"
version = "0.1.0"
description = "A self-learning AI that grows like a child — 7 neural modules learning from raw pixels"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["reinforcement-learning", "world-model", "pytorch", "atari", "self-supervised-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "Pillow>=9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
atari = ["gymnasium[atari]>=0.29", "ale-py>=0.9"]
plotting = ["matplotlib>=3.7"]
streaming = ["opencv-python-headless>=4.8"]
dev = ["build>=1.2.0", "twine>=5.0.0", "pytest>=7.0"]
all = ["gymnasium[atari]>=0.29", "ale-py>=0.9", "matplotlib>=3.7", "opencv-python-headless>=4.8"]

[tool.setuptools.packages.find]
include = ["infant_brain*"]
