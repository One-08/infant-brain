# GPU training — longer runs, larger buffers
env:
  type: atari
  game: Pong
  frameskip: 4

brain:
  latent_dim: 64
  hidden_dim: 512
  n_concepts: 12

training:
  episodes: 10000
  max_steps: 1000
  batch_size: 128
  buffer_size: 500000
  curiosity_rate: 0.15
  plan_every: 25
  plan_len: 8
  k_plans: 6
  cluster_every: 200
  sleep_every: 500
  check_every: 100
  seed: 42
